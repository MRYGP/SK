<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" role="img" aria-labelledby="title desc">
  <title id="title">顶楼，从最便宜变成最贵</title>
  <desc id="desc">左右楼层剖面对比。没有电梯时价格向低楼层升高，有了安全电梯后价格向高楼层升高。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="oldBuilding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263b50"/>
      <stop offset="1" stop-color="#172838"/>
    </linearGradient>
    <linearGradient id="newBuilding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#284f58"/>
      <stop offset="1" stop-color="#17313d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbc55"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L5 9 L9 1 Z" fill="#ff8a4c"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 9 L5 1 L9 9 Z" fill="#67e8c4"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="900" height="383" rx="22" fill="url(#bg)"/>
  <rect width="900" height="383" rx="22" fill="url(#grid)"/>
  <circle cx="450" cy="225" r="152" fill="#2dd4bf" opacity="0.035"/>

  <g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
    <text x="45" y="42" fill="#8aa3b8" font-size="14" font-weight="700" letter-spacing="2">025 · AI 产品生死尺</text>
    <text x="45" y="85" fill="#f7fbff" font-size="36" font-weight="800">顶楼，从最便宜变成最贵</text>
    <text x="855" y="82" fill="#93a9bc" font-size="15" text-anchor="end">一个装置，倒置整栋楼的价值</text>

    <!-- Before elevator -->
    <g transform="translate(52 112)">
      <rect width="330" height="228" rx="18" fill="#0c1a29" stroke="#31475b"/>
      <text x="22" y="29" fill="#ffb36b" font-size="16" font-weight="700">没有安全电梯</text>
      <text x="308" y="29" fill="#8096a9" font-size="13" text-anchor="end">楼层越高，越不值钱</text>

      <line x1="49" y1="67" x2="49" y2="188" stroke="#ff8a4c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowDown)"/>
      <text x="49" y="55" fill="#ffb36b" font-size="12" text-anchor="middle">便宜</text>
      <text x="49" y="212" fill="#ffb36b" font-size="12" text-anchor="middle">更贵</text>

      <g transform="translate(83 48)">
        <rect width="215" height="164" rx="6" fill="url(#oldBuilding)" stroke="#53687a"/>
        <rect x="0" y="0" width="215" height="29" rx="6" fill="#3a4651"/>
        <text x="14" y="20" fill="#b9c5ce" font-size="12" font-weight="700">顶楼 · 杂物 / 便宜</text>
        <g stroke="#506476" stroke-width="1">
          <line x1="0" y1="29" x2="215" y2="29"/>
          <line x1="0" y1="56" x2="215" y2="56"/>
          <line x1="0" y1="83" x2="215" y2="83"/>
          <line x1="0" y1="110" x2="215" y2="110"/>
          <line x1="0" y1="137" x2="215" y2="137"/>
        </g>
        <g fill="#8ea0ae">
          <rect x="18" y="38" width="35" height="10" rx="2"/><rect x="70" y="38" width="35" height="10" rx="2"/><rect x="122" y="38" width="35" height="10" rx="2"/>
          <rect x="18" y="65" width="35" height="10" rx="2"/><rect x="70" y="65" width="35" height="10" rx="2"/><rect x="122" y="65" width="35" height="10" rx="2"/>
          <rect x="18" y="92" width="35" height="10" rx="2"/><rect x="70" y="92" width="35" height="10" rx="2"/><rect x="122" y="92" width="35" height="10" rx="2"/>
          <rect x="18" y="119" width="35" height="10" rx="2"/><rect x="70" y="119" width="35" height="10" rx="2"/><rect x="122" y="119" width="35" height="10" rx="2"/>
        </g>
        <rect x="0" y="137" width="215" height="27" fill="#5a3729" opacity="0.9"/>
        <text x="14" y="156" fill="#ffd0ad" font-size="12" font-weight="700">低楼层 · 最贵</text>
        <path d="M184 147h15v17h-15z M188 139h7v8" fill="none" stroke="#ffbd7a" stroke-width="2"/>
      </g>
    </g>

    <!-- Transformation switch -->
    <g transform="translate(450 225)">
      <circle r="45" fill="#102b35" stroke="#5eead4" stroke-width="2" filter="url(#softGlow)"/>
      <path d="M-13-18h26v36h-26z M-7-10l7-7 7 7 M-7 10l7 7 7-7" fill="none" stroke="#7ff4d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-25 0h10 M15 0h10" stroke="#ffbc55" stroke-width="4" stroke-linecap="round"/>
      <text y="68" fill="#d9fff5" font-size="13" font-weight="700" text-anchor="middle">安全制动</text>
      <text y="86" fill="#7f9bab" font-size="11" text-anchor="middle">不是更快，是第一次可行</text>
    </g>

    <!-- After elevator -->
    <g transform="translate(518 112)">
      <rect width="330" height="228" rx="18" fill="#0c1a29" stroke="#315b60"/>
      <text x="22" y="29" fill="#7ff4d6" font-size="16" font-weight="700">有了安全电梯</text>
      <text x="308" y="29" fill="#8096a9" font-size="13" text-anchor="end">楼层越高，越值钱</text>

      <g transform="translate(31 48)">
        <rect width="215" height="164" rx="6" fill="url(#newBuilding)" stroke="#538088"/>
        <rect x="0" y="0" width="215" height="29" rx="6" fill="url(#gold)"/>
        <text x="14" y="20" fill="#10202b" font-size="12" font-weight="800">顶楼 · 景观 / 最贵</text>
        <g stroke="#52727a" stroke-width="1">
          <line x1="0" y1="29" x2="215" y2="29"/>
          <line x1="0" y1="56" x2="215" y2="56"/>
          <line x1="0" y1="83" x2="215" y2="83"/>
          <line x1="0" y1="110" x2="215" y2="110"/>
          <line x1="0" y1="137" x2="215" y2="137"/>
        </g>
        <g fill="#78a9af">
          <rect x="18" y="38" width="35" height="10" rx="2"/><rect x="70" y="38" width="35" height="10" rx="2"/><rect x="122" y="38" width="35" height="10" rx="2"/>
          <rect x="18" y="65" width="35" height="10" rx="2"/><rect x="70" y="65" width="35" height="10" rx="2"/><rect x="122" y="65" width="35" height="10" rx="2"/>
          <rect x="18" y="92" width="35" height="10" rx="2"/><rect x="70" y="92" width="35" height="10" rx="2"/><rect x="122" y="92" width="35" height="10" rx="2"/>
          <rect x="18" y="119" width="35" height="10" rx="2"/><rect x="70" y="119" width="35" height="10" rx="2"/><rect x="122" y="119" width="35" height="10" rx="2"/>
        </g>
        <rect x="174" y="29" width="25" height="135" fill="#102735" stroke="#6ee7cf" stroke-width="1.5"/>
        <rect x="178" y="55" width="17" height="28" rx="2" fill="#3ed8bd"/>
        <path d="M182 69h9" stroke="#0b2830" stroke-width="2"/>
      </g>

      <line x1="281" y1="190" x2="281" y2="69" stroke="#67e8c4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowUp)"/>
      <text x="281" y="212" fill="#84e9d0" font-size="12" text-anchor="middle">便宜</text>
      <text x="281" y="55" fill="#84e9d0" font-size="12" text-anchor="middle">更贵</text>
    </g>

    <text x="450" y="368" fill="#92a9ba" font-size="14" font-weight="600" text-anchor="middle">判断 AI 产品，不只看它让旧事快多少 · 看它让哪件旧世界做不到的事第一次成立</text>
  </g>
</svg>
