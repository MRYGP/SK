<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">顶楼，从最便宜变成最贵</title>
  <desc id="desc">方形信息图。没有电梯和有安全电梯时，楼层价格箭头完全相反。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102a3f"/></linearGradient>
    <linearGradient id="buildingA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#30465a"/><stop offset="1" stop-color="#172838"/></linearGradient>
    <linearGradient id="buildingB" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2c5961"/><stop offset="1" stop-color="#17313d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffc25c"/><stop offset="1" stop-color="#ff7848"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L5 9 9 1Z" fill="#ff8a4c"/></marker>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 9L5 1 9 9Z" fill="#67e8c4"/></marker>
  </defs>

  <rect width="900" height="900" rx="36" fill="url(#bg)"/>
  <rect width="900" height="900" rx="36" fill="url(#grid)"/>

  <g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
    <text x="70" y="76" fill="#8aa3b8" font-size="22" font-weight="700" letter-spacing="3">025 · AI 产品生死尺</text>
    <text x="70" y="153" fill="#f7fbff" font-size="58" font-weight="900">顶楼，从最便宜</text>
    <text x="70" y="220" fill="url(#gold)" font-size="58" font-weight="900">变成最贵</text>
    <text x="70" y="264" fill="#9cb1c2" font-size="21">一个安全装置，倒置整栋楼的价值</text>

    <!-- comparison cards -->
    <g transform="translate(70 315)">
      <rect width="350" height="395" rx="25" fill="#0c1a29" stroke="#344c60" stroke-width="2"/>
      <text x="26" y="45" fill="#ffb36b" font-size="24" font-weight="800">没有安全电梯</text>
      <text x="26" y="76" fill="#8098ab" font-size="17">越往上，越便宜</text>
      <line x1="48" y1="133" x2="48" y2="328" stroke="#ff8a4c" stroke-width="6" stroke-linecap="round" marker-end="url(#down)"/>
      <text x="48" y="115" fill="#ffc18a" font-size="16" text-anchor="middle">便宜</text>
      <text x="48" y="365" fill="#ffc18a" font-size="16" text-anchor="middle">更贵</text>
      <g transform="translate(92 105)">
        <rect width="222" height="250" rx="8" fill="url(#buildingA)" stroke="#5c7183"/>
        <rect width="222" height="42" rx="8" fill="#414c57"/>
        <text x="16" y="28" fill="#c7d1d8" font-size="15" font-weight="700">顶楼 · 杂物 / 便宜</text>
        <g stroke="#5a6d7d"><path d="M0 42H222M0 83H222M0 124H222M0 165H222M0 206H222"/></g>
        <g fill="#90a2b0">
          <path d="M20 55h42v15H20zM79 55h42v15H79zM138 55h42v15h-42zM20 96h42v15H20zM79 96h42v15H79zM138 96h42v15h-42zM20 137h42v15H20zM79 137h42v15H79zM138 137h42v15h-42zM20 178h42v15H20zM79 178h42v15H79zM138 178h42v15h-42z"/>
        </g>
        <rect y="206" width="222" height="44" fill="#653d2d"/>
        <text x="16" y="234" fill="#ffd1ae" font-size="15" font-weight="700">低楼层 · 最贵</text>
      </g>
    </g>

    <g transform="translate(480 315)">
      <rect width="350" height="395" rx="25" fill="#0c1a29" stroke="#37656a" stroke-width="2"/>
      <text x="26" y="45" fill="#7ff4d6" font-size="24" font-weight="800">有了安全电梯</text>
      <text x="26" y="76" fill="#8098ab" font-size="17">越往上，越值钱</text>
      <g transform="translate(34 105)">
        <rect width="222" height="250" rx="8" fill="url(#buildingB)" stroke="#5f8d91"/>
        <rect width="222" height="42" rx="8" fill="url(#gold)"/>
        <text x="16" y="28" fill="#132431" font-size="15" font-weight="900">顶楼 · 景观 / 最贵</text>
        <g stroke="#54767c"><path d="M0 42H222M0 83H222M0 124H222M0 165H222M0 206H222"/></g>
        <g fill="#78a9af">
          <path d="M20 55h42v15H20zM79 55h42v15H79zM138 55h28v15h-28zM20 96h42v15H20zM79 96h42v15H79zM138 96h28v15h-28zM20 137h42v15H20zM79 137h42v15H79zM138 137h28v15h-28zM20 178h42v15H20zM79 178h42v15H79zM138 178h28v15h-28z"/>
        </g>
        <rect x="178" y="42" width="28" height="208" fill="#102735" stroke="#70e6cf" stroke-width="2"/>
        <rect x="183" y="88" width="18" height="42" rx="3" fill="#3ed8bd"/>
        <path d="M187 109h10" stroke="#0b2830" stroke-width="3"/>
      </g>
      <line x1="303" y1="333" x2="303" y2="138" stroke="#67e8c4" stroke-width="6" stroke-linecap="round" marker-end="url(#up)"/>
      <text x="303" y="365" fill="#8bf0d7" font-size="16" text-anchor="middle">便宜</text>
      <text x="303" y="115" fill="#8bf0d7" font-size="16" text-anchor="middle">更贵</text>
    </g>

    <!-- center switch -->
    <g transform="translate(450 513)">
      <circle r="48" fill="#102d38" stroke="#5eead4" stroke-width="3"/>
      <path d="M-15-22h30v44h-30zM-8-11l8-8 8 8M-8 11l8 8 8-8" fill="none" stroke="#7ff4d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-30 0h13M17 0h13" stroke="#ffbc55" stroke-width="5" stroke-linecap="round"/>
    </g>

    <rect x="70" y="753" width="760" height="92" rx="22" fill="#112737" stroke="#27475a"/>
    <text x="450" y="793" fill="#dffff8" font-size="23" font-weight="800" text-anchor="middle">拔掉 AI，它只是变慢</text>
    <text x="450" y="826" fill="#92adbd" font-size="18" text-anchor="middle">还是这件事根本不成立？</text>
  </g>
</svg>
