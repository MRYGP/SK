<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Microsoft YaHei','PingFang SC','Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="170" y="30" width="340" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#444441">帮人判断：这个点子值不值得做</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#5F5E5A">AI 之前，这是一整块</text>

<path d="M340 94 L340 128 L190 128 L190 152" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M340 94 L340 128 L490 128 L490 152" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="50" y="160" width="280" height="200" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="190" y="190" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#444441">分析层</text>
<text x="190" y="216" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#5F5E5A">AI 已经接管</text>
<text x="74" y="252" dominant-baseline="central" font-size="16" fill="#5F5E5A">市场规模、竞品与定价</text>
<text x="74" y="282" dominant-baseline="central" font-size="16" fill="#5F5E5A">归纳主题、写报告</text>
<text x="74" y="312" dominant-baseline="central" font-size="16" fill="#5F5E5A">谁都能几秒钟拿到</text>
<text x="190" y="342" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#444441">4 – 59 美元</text>

<rect x="350" y="160" width="280" height="200" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="190" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#712B13">触达层</text>
<text x="490" y="216" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#993C1D">AI 接不了</text>
<text x="374" y="252" dominant-baseline="central" font-size="16" fill="#993C1D">找到 40 个真实从业者</text>
<text x="374" y="282" dominant-baseline="central" font-size="16" fill="#993C1D">核验身份、付钱给对方</text>
<text x="374" y="312" dominant-baseline="central" font-size="16" fill="#993C1D">担保这个人是真的</text>
<text x="490" y="342" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#712B13">100 – 400 美元</text>
